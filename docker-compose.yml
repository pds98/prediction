services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
      POSTGRES_DB: atelier
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      PORT: 4006
      DATABASE_URL: postgres://atelier:atelier@db:5432/atelier
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports:
      - "4006:4006"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4006
    ports:
      - "5176:5176"
    depends_on:
      - api

volumes:
  donnees:
